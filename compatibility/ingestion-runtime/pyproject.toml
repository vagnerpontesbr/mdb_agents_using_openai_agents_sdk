[project]
name = "telecom-ingestion-runtime-probe"
version = "0.0.1"
description = "Phase 0 CPU ingestion dependency proof; not an ingestion service"
requires-python = "==3.14.6"
dependencies = ["docling==2.143.1", "torch==2.14.1"]

[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

[dependency-groups]
build = ["uv_build==0.11.3"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

