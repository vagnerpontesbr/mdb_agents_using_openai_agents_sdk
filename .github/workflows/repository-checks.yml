name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository foundation
        run: python3 scripts/check_repository.py
      - name: Test compatibility evidence and live-call controls
        run: python3 -m unittest discover -s tests/compatibility -v
      - name: Test demo authentication and Engine admission without network
        run: python3 -m unittest discover -s tests/demo_auth -v

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.21"
      - name: Install verified Python 3.15.2 distribution
        # uv's tested catalog predates this release. Preserve the exact target;
        # use the same verified upstream distribution as Phase 0 Linux evidence.
        run: |
          curl --fail --location --retry 2 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2%2B20261026-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' -o "$RUNNER_TEMP/python315.tar.gz"
          echo "7b03163a980c607ba8194709d4a4086735a7a9c488cc475b098157306927b36b  $RUNNER_TEMP/python315.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/telecom-python"
          tar -xzf "$RUNNER_TEMP/python315.tar.gz" -C "$RUNNER_TEMP/telecom-python"
          uv sync --frozen --group build --python "$RUNNER_TEMP/telecom-python/python/bin/python3.15"
      - name: Validate backend
        run: |
          uv run --frozen ruff check src/telecom_app tests/foundation
          uv run --frozen mypy
          uv run --frozen pytest -q
          uv build --no-build-isolation
          uv pip check
      - name: Validate SDK orchestration and Engine contracts without providers
        run: |
          uv sync --project compatibility/openai_engine_adapter --frozen --python "$RUNNER_TEMP/telecom-python/python/bin/python3.15"
          uv run --project compatibility/openai_engine_adapter --frozen python -m unittest discover -s tests/hosted_contract -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate frontend and browser identity/support journeys
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
