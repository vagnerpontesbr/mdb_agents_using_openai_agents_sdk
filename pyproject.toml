[project]
name = "telecom-foundation"
version = "0.1.0"
description = "Authenticated foundation for the telecom agent reference demo"
requires-python = "==3.15.2"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pymongo==4.19.0",
  "openai-agents[voice]==0.24.0",
  "openai==3.40.0",
  "pillow==13.0.0",
]

[project.scripts]
telecom-api = "telecom_app.cli:serve"
telecom-admin = "telecom_app.cli:admin"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telecom_app", "compatibility.demo_auth"]
package-dir = {telecom_app = "src/telecom_app", "compatibility.demo_auth" = "compatibility/demo_auth"}

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "mypy==2.4.1", "ruff==0.17.3"]
build = ["setuptools==84.2.1"]

[tool.uv]
default-groups = ["dev", "build"]

[tool.ruff]
target-version = "py315"
line-length = 100
include = ["src/telecom_app/**/*.py", "tests/foundation/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/telecom_app"]

[[tool.mypy.overrides]]
module = ["compatibility.demo_auth.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests/foundation"]
pythonpath = ["."]
