[project]
name = "telecom-openai-engine-adapter"
version = "0.0.1"
description = "Experimental bounded OpenAI Runner adapter for MongoDB Agent Engine"
requires-python = "==3.15.2"
dependencies = [
  "openai==3.40.0",
  "openai-agents==0.24.0",
  "agent-engine-sdk==0.11.11",
  "agent-engine-runner-shared==0.11.11",
  "pymongo==4.19.0",
]

[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openai_engine_adapter"
