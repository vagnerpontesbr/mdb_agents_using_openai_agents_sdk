[project]
name = "telecom-hosted-contract-probe"
version = "0.0.1"
description = "Phase 0 Engine runner contract inspection; not an application or adapter"
requires-python = "==3.15.2"
dependencies = [
  "telecom-openai-engine-adapter",
  "openai-agents==0.24.0",
  "agent-engine-sdk==0.11.11",
  "agent-engine-runner-shared==0.11.11",
]

[tool.uv.sources]
telecom-openai-engine-adapter = { path = "../openai_engine_adapter", editable = true }

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
